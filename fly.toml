app = "students-anti-cheating-system"
primary_region = "ams"

[build]
  dockerfile = "ai_backend/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[env]
  FLASK_ENV = "production"
  PYTHONUNBUFFERED = "true"
  YOLO_VERBOSE = "false"
  CORS_ORIGIN = "https://embedded-system-project.vercel.app"
